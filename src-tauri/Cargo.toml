[package]
name = "my-focus"
version = "0.1.1"
description = "A focused desktop productivity widget"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "fs-write-file", "window-set-resizable", "window-set-size", "dialog-save", "dialog-open", "fs-read-file", "window-center", "window-set-position", "window-set-decorations", "notification-all", "window-unminimize", "window-set-always-on-top", "window-show", "window-minimize", "window-start-dragging", "window-close", "global-shortcut-all", "window-hide", "notification", "global-shortcut", "system-tray", "shell-open", "window-set-skip-taskbar"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
